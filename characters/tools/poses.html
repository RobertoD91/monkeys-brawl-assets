<!doctype html>
<html><head><meta charset="utf-8"><title>Pose di prova</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body>
<script src="three.min.js"></script>
<script src="gltf_bundle.js"></script>
<script>
// Renderizza le 8 pose di prova (gist) per i personaggi passati in ?ids=roberto,francesco
const P = new URLSearchParams(location.search);
const IDS = (P.get('ids') || 'roberto,francesco').split(',');
const POSES = [
  ['braccia su', 'gen.cheer', 0.5], ['pugno', 'atk.cross', 0.45], ['calcio', 'atk.high_kick', 0.45],
  ['accovacciato', 'atk.leg_sweep', 0.35], ['salto', 'gen.jump', 0.45], ['colpito', 'gen.hit_heavy', 0.3],
  ['caduta', 'gen.knockdown', 0.6], ['vittoria', 'gen.victory', 0.5],
];
const CW = 300, CH = 380;
const W = CW * POSES.length, H = CH * IDS.length;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.setScissorTest(true);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const loader = new MB_GLTF.GLTFLoader(); loader.setMeshoptDecoder(MB_GLTF.MeshoptDecoder);
const load = u => new Promise((res, rej) => loader.load(u, res, undefined, rej));
const grad = (() => { const t = new THREE.DataTexture(new Uint8Array([96,96,96,255,178,178,178,255,255,255,255,255]), 3, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
window.__log = [];
(async () => {
  try {
    const lib = await load('library.glb');
    const clips = {}; lib.animations.forEach(a => clips[a.name] = a);
    const libHips = lib.scene.getObjectByName('mixamorigHips').position.y;
    const chars = {};
    for (const id of IDS) chars[id] = await load(id + '.glb');
    IDS.forEach((id, r) => {
      POSES.forEach(([label, clipName, t], c) => {
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 0.9));
        const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(1, 2, 3); scene.add(dl);
        const root = MB_GLTF.SkeletonUtils.clone(chars[id].scene);
        let sm = null; root.traverse(o => { if (o.isSkinnedMesh && !sm) sm = o; });
        sm.material = new THREE.MeshToonMaterial({ map: sm.material.map, gradientMap: grad, side: THREE.DoubleSide });
        scene.add(root);
        const hh = root.getObjectByName('mixamorigHips').position.y;
        const clip = clips[clipName].clone();
        clip.tracks.forEach(tr => { if (tr.name === 'mixamorigHips.position') { const v = tr.values; for (let i = 0; i < v.length; i++) v[i] *= hh / libHips; } });
        const mixer = new THREE.AnimationMixer(root);
        mixer.clipAction(clip).play();
        mixer.setTime(clip.duration * t);
        root.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(sm);
        const cam = new THREE.PerspectiveCamera(30, CW / CH, 0.1, 50);
        cam.position.set(2.2, 1.3, 5.2); cam.lookAt(0, 0.95, 0);
        renderer.setViewport(c * CW, (IDS.length - 1 - r) * CH, CW, CH);
        renderer.setScissor(c * CW, (IDS.length - 1 - r) * CH, CW, CH);
        renderer.setClearColor(r % 2 ? 0xf3f0ea : 0xffffff);
        renderer.render(scene, cam);
        __log.push([id, label, clipName, clip.duration.toFixed(2), box.min.y.toFixed(2), box.max.y.toFixed(2)]);
      });
    });
    window.__done = 1;
  } catch (e) { window.__err = String(e && e.stack || e); }
})();
</script></body></html>
